# LCM canonical package database.
#
# Keys are distro-neutral canonical ids.  A profile stores these ids, never
# distro package names, so the same profile remains valid after a hop.
#
# Confidence is about the *name mapping*, not about whether the package
# exists in your particular release.  `lcm check` reports what it cannot
# map; it does not silently guess.
